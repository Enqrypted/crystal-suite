<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Onyx</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">Ox</div>
      <div>
        <div class="brand-name">Onyx</div>
        <div class="brand-sub">Instant replay for your games</div>
      </div>
    </div>
    <div class="top-actions">
      <div id="pill" class="pill"></div>
    </div>
  </header>
  <main class="split">
    <section class="content" id="content">
      <div class="heroes" id="hero"></div>
      <div class="block">
        <div class="block-head">
          <h2>Clips <span id="clip-count" class="count"></span></h2>
          <button type="button" class="btn ghost" id="open-folder">
            <svg viewBox="0 0 16 16"><path d="M2 4.5h4l1.3 1.5H14v6.5H2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span>Open folder</span>
          </button>
        </div>
        <div id="clips" class="clips"></div>
      </div>
      <div class="block">
        <div class="block-head"><h2>What to record</h2></div>
        <div class="seg big" id="mode">
          <button type="button" data-mode="auto">Games, automatically</button>
          <button type="button" data-mode="window">One window</button>
          <button type="button" data-mode="screen">A screen</button>
        </div>
        <div id="source" class="source"></div>
      </div>
    </section>
    <aside class="settings" id="settings"></aside>
  </main>
  <div id="player" class="player" hidden>
    <div class="player-box">
      <div class="player-head">
        <div><div id="player-title" class="player-title"></div><div id="player-sub" class="player-sub"></div></div>
        <div class="player-actions">
          <button type="button" class="btn ghost" id="player-reveal">Show in folder</button>
          <button type="button" class="btn ghost danger" id="player-trash">Delete</button>
          <button type="button" class="icon-btn" id="player-close" title="Close (Esc)">
            <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <video id="player-video" controls></video>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
